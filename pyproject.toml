[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "aegiswatch"
version = "1.0.0"
description = "Microsecond Limit Order Book Market Abuse Surveillance & Anomaly Engine"
readme = "README.md"
authors = [{ name = "Dev Vinod Lahrani" }]
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "numpy>=1.26.0",
    "scikit-learn>=1.4.0",
    "scipy>=1.12.0",
    "websockets>=12.0",
    "pydantic>=2.6.0"
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
